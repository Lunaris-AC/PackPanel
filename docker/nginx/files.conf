server {
    listen 8081 default_server;
    server_name _;

    root /srv/packpanel/storage/endpoints;
    index index.php index.json packpanel.json;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Global security headers for CDN/files distribution domain
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "sandbox; default-src 'none';" always;
    add_header Referrer-Policy "no-referrer" always;

    # Deny all hidden files (e.g. .packpanel_manifest.json, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # 1. Compatibility and dynamic manifests: Treat index.php and packpanel.json as dynamic JSON
    location ~* (index\.php|packpanel\.json|index\.json)$ {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 2. Immutable release files: cache aggressively (1 year)
    location ~ ^/[^/]+/releases/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 3. Direct static delivery fallback
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        try_files $uri $uri/ =404;
    }
}
