server {
    listen 8081 default_server;
    server_name _;

    root /srv/packpanel/storage/endpoints;
    index index.php index.json;

    # Launcher CORS & Byte Ranges
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 1. Compatibility route: Treat index.php as raw JSON UTF-8
    location ~* \.php$ {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # 2. Releases and files direct static delivery
    location / {
        # Return 404 explicitly if path or file does not exist. Never proxy to API, never return empty JSON.
        try_files $uri $uri/ =404;
    }
}
