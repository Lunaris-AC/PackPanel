server {
    listen 8081 default_server;
    server_name _;

    root /srv/packpanel/storage/endpoints;
    index index.php index.json packpanel.json;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Global security headers for CDN/files distribution domain
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "sandbox; default-src 'none';" always;
    add_header Referrer-Policy "no-referrer" always;

    # Deny all hidden files (e.g. .packpanel_manifest.json, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    location = /launcher-updates/windows-x64.json {
        root /srv/packpanel;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ "^/launcher-updates/[a-f0-9]{64}\.zip$" {
        root /srv/packpanel;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /launcher-updates/ { return 404; }

    location ^~ /player-services/ {
        if ($uri !~ "^/player-services/[a-fA-F0-9-]{36}(/options|/game-logs)?$") { return 404; }
        limit_except GET PUT POST { deny all; }
        limit_req zone=player_services burst=60 nodelay;
        limit_req zone=player_services_total burst=120 nodelay;
        limit_req_status 429;
        client_max_body_size 370k;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_hide_header Cache-Control;
        proxy_set_header Cookie "";
        proxy_pass http://api:3000/api/v2/player-services/;
    }

    # Only the public download API is proxied on this listener.
    location ^~ /play-api/ {
        if ($uri !~ "^/play-api/[a-z0-9_-]+(/downloads/[a-f0-9-]+)?$") { return 404; }
        limit_except GET { deny all; }
        proxy_pass http://api:3000/api/v2/play/;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ~ ^/play/[a-z0-9_-]+/?$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /index.html =404;
    }

    location ~ ^/assets/index-[A-Za-z0-9_-]+\.(js|css)$ {
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
        try_files $uri =404;
    }

    # 1. Compatibility and dynamic manifests: Treat index.php and packpanel.json as dynamic JSON
    location ~ ^/[^/]+/incoming(?:/|$) {
        return 404;
    }
    location ~* (index\.php|packpanel\.json|index\.json)$ {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 2. Immutable release files: cache aggressively (1 year)
    location ~ ^/[^/]+/releases/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 3. Direct static delivery fallback
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        try_files $uri $uri/ =404;
    }
}
