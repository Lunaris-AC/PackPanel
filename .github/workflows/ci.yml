name: Build and test

on:
  push:
    branches: [master, main, 'feature/**', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspaces:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=low
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_configuration_only
      SESSION_SECRET: ci_configuration_check_minimum_32_characters
      DATA_DIR: /tmp/packpanel-ci-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell scripts and Compose configuration
        run: |
          bash -n install.sh
          for script in scripts/*.sh; do bash -n "$script"; done
          docker compose config --quiet
      - run: docker compose build
